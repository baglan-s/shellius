services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shellius
      POSTGRES_USER: shellius
      POSTGRES_PASSWORD: shellius_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cloud/migrations:/docker-entrypoint-initdb.d

  cloud:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://shellius:shellius_dev@postgres:5432/shellius?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      - postgres

volumes:
  pgdata:
